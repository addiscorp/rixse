# Every pull request: the gateway's tests and typecheck (Bun), and the publish
# proof for its npm tarball (node).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # Public repo: self-hosted runners refuse public repos (a fork PR must never
    # run on our machines); GitHub-hosted runners are free here (addiscorp/infra#34).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: npm ci --no-audit --no-fund
      - run: npm test

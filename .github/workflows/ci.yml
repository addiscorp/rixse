# Every pull request: the gateway's tests and typecheck (Bun), and the publish
# proof for its npm tarball (node).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # Temporary (addiscorp/infra#34): [simien] no longer hosts mirab VMs. Back to
    # a fresh mirab VM, mirab-linux-x64 (APS 11), once x86 mirab VMs have capacity.
    runs-on: host-linux-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: npm ci --no-audit --no-fund
      - run: npm test

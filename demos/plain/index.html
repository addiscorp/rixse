<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rixse · movies, no framework</title>
<style>
  :root { color-scheme: dark; --bg: #0b0d10; --panel: #12151a; --line: #232830; --fg: #e8ecef; --soft: #8a919c; --accent: #4f7cff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, -apple-system, sans-serif; }
  header.bar { display: flex; align-items: baseline; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  header.bar .mark { font-weight: 650; font-size: 16px; }
  header.bar .soft { color: var(--soft); font-size: 12px; }
  main { display: grid; grid-template-columns: minmax(300px, 380px) minmax(0, 1fr); gap: 0; height: calc(100vh - 45px); }
  section.chat { display: flex; flex-direction: column; border-right: 1px solid var(--line); min-height: 0; }
  .pane-head { padding: 10px 14px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; }
  .pane-title { margin: 0; font-size: 13px; font-weight: 600; }
  .soft { color: var(--soft); font-size: 11.5px; }
  .turns { flex: 1; overflow: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 92%; padding: 7px 10px; border-radius: 10px; white-space: pre-wrap; }
  .msg.you { align-self: flex-end; background: #1d2a4d; }
  .msg.agent { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); }
  .msg .footnote { display: block; margin-top: 4px; color: var(--soft); font-size: 11px; }
  .hint { color: var(--soft); font-size: 12.5px; }
  form.composer { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line); }
  textarea { flex: 1; resize: none; background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: inherit; }
  button { background: var(--accent); color: white; border: 0; border-radius: 8px; padding: 0 16px; font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: 0.4; cursor: default; }
  section.screen { overflow: auto; padding: 14px 16px; min-width: 0; }
  .views { display: grid; gap: 14px; grid-auto-flow: dense; }
  .view { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-width: 0; }
  .view h3 { margin: 0 0 2px; font-size: 14px; }
  .view .meta { color: var(--soft); font: 11px ui-monospace, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 8px; }
  .view .err { color: #ff8f8f; font-size: 12.5px; }
  .stat .num { font-size: 34px; font-weight: 650; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .stat .cap { color: var(--soft); font-size: 12.5px; }
  svg text { fill: var(--soft); }
  .bar-row text { font-size: 11px; }
  rect[data-bar] { cursor: pointer; }
  .selected-note { margin-top: 6px; color: var(--soft); font-size: 11.5px; }
  table.rows { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  table.rows th, table.rows td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--line); max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  table.rows th { color: var(--soft); font-weight: 600; }
  .legend { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 3px; font-size: 12.5px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 7px; }
  .legend .pct { color: var(--soft); float: right; font-variant-numeric: tabular-nums; }
</style>
<script type="importmap">
{
  "imports": {
    "rixse/ui": "/packages/rixse/src/index.js",
    "rixse-demo-shared/movies": "/demos/shared/movies.js",
    "rixse-demo-shared/zega": "/demos/shared/zega.js",
    "rixse-demo-shared/agent": "/demos/shared/agent.js"
  }
}
</script>
</head>
<body>
<header class="bar">
  <span class="mark">rixse</span>
  <span class="soft">movies demo · plain HTML + ES modules, no framework · same vocabulary, zega engine and agent route as the canvas demo</span>
</header>
<main>
  <section class="chat" aria-label="Chat">
    <div class="pane-head">
      <h2 class="pane-title">Chat</h2>
      <span class="soft" id="agent-endpoint"></span>
    </div>
    <div class="turns" id="turns">
      <p class="hint">Ask about the 250 highest-grossing films, e.g. “top 10 movies by box office”, “box office by genre”, “movies Tom Hanks and Meg Ryan are both in”.</p>
    </div>
    <form class="composer" id="composer">
      <textarea id="chat-input" placeholder="Message the agent" rows="2"></textarea>
      <button type="submit" id="send">Send</button>
    </form>
  </section>
  <section class="screen" aria-label="Movies">
    <div class="pane-head">
      <h2 class="pane-title">Movies</h2>
      <span class="soft" id="status">loading zega…</span>
    </div>
    <div id="screen" style="padding-top:12px"></div>
  </section>
</main>
<script type="module" src="./main.js"></script>
</body>
</html>

[package]
name = "zega-ios"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

# The zega engine as a static library for the iOS demo, pinned to the same
# commit the web demo's wasm build was made from
# (demos/canvas/public/zega/SOURCE.md).
[lib]
crate-type = ["staticlib"]

# The .a slices are committed; keep them lean (Xcode links and dead-strips the
# final app anyway).
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "debuginfo"

[dependencies]
serde_json = "1.0"
zega = { git = "https://github.com/zegadb/zega.git", rev = "ef0982c01e770c604637e59cf42582f298af07c7", default-features = false }
